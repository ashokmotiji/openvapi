services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama: